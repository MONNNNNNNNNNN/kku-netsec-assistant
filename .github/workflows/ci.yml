name: ci
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  test:
    name: unit + integration (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --version
      - run: npm test

  e2e:
    name: browser e2e (Playwright, Chromium)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: docs/screenshots/

  docker:
    name: docker compose demo smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile demo up -d --build
      - name: wait for /healthz, then for live items from every source
        run: node scripts/smoke.js http://127.0.0.1:8480
      - if: failure()
        run: docker compose --profile demo logs
      - run: docker compose --profile demo down -v

  docker-prod:
    name: docker compose prod with the unedited example config
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cp netsec.example.json netsec.json && mkdir -p backups && printf 'ci-admin-password-1\n' > admin.pw && chmod 644 admin.pw
      - run: docker compose --profile prod build
      - run: docker compose --profile prod run --rm -v "$PWD/admin.pw:/pw:ro" board node cli/board.js init --password-file /pw
      - run: docker compose --profile prod up -d
      - name: reachable from the host, login works
        run: SMOKE_LOGIN_ONLY=1 DEMO_ADMIN_PASSWORD=ci-admin-password-1 node scripts/smoke.js http://127.0.0.1:8480
      - if: failure()
        run: docker compose --profile prod logs
      - run: docker compose --profile prod down -v
