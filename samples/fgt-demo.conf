        set name "Student-to-Internet"
        set srcintf "port1"
        set dstintf "virtual-wan-link"
        set action accept
        set srcaddr "Student-Net"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set utm-status enable
        set ips-sensor "default"
        set webfilter-profile "default"
        set ssl-ssh-profile "certificate-inspection"
        set logtraffic all
        set nat enable
    next
    edit 2
        set name "Staff-to-Internet"
        set srcintf "port3"
        set dstintf "virtual-wan-link"
        set action accept
        set srcaddr "Staff-Net"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set nat enable
    next
    edit 3
        set name "Web-Portal-Inbound"
        set srcintf "wan1"
        set dstintf "port2"
        set action accept
        set srcaddr "all"
        set dstaddr "Web-Portal"
        set schedule "always"
        set service "ALL"
        set utm-status enable
        set ips-sensor "protect_http_server"
    next
    edit 4
