# SYNTHETIC DEMO CONFIG. Not from any real network. Issues are seeded on purpose.
config system global
    set admintimeout 60
    set alias "FG600F"
    set hostname "FGT-DEMO-CORE"
    set strong-crypto disable
    set timezone 57
end
config system interface
    edit "wan1"
        set vdom "root"
        set ip 203.0.113.2 255.255.255.252
        set allowaccess ping https ssh
        set role wan
        set alias "ISP-A"
    next
    edit "wan2"
        set vdom "root"
        set ip 198.51.100.2 255.255.255.252
        set allowaccess ping
        set role wan
        set alias "NREN-uplink"
    next
    edit "port1"
        set vdom "root"
        set ip 10.10.0.1 255.255.0.0
        set allowaccess ping https http
        set role lan
        set alias "Student-LAN"
    next
    edit "port2"
        set vdom "root"
        set ip 10.50.0.1 255.255.255.0
        set allowaccess ping
        set role dmz
        set alias "DC-Servers"
    next
    edit "port3"
        set vdom "root"
        set ip 10.20.0.1 255.255.0.0
        set allowaccess ping
        set role lan
        set alias "Staff-LAN"
    next
    edit "mgmt"
        set vdom "root"
        set ip 10.99.0.1 255.255.255.0
        set allowaccess ping https ssh
        set dedicated-to management
    next
end
config system admin
    edit "admin"
        set accprofile "super_admin"
        set vdom "root"
        set password ENC SH2nU3Zx8kq0demoNOTAREALHASHxxxxxxxxxxxxxxxxxxxx
    next
    edit "noc-readonly"
        set accprofile "prof_admin"
        set vdom "root"
        set trusthost1 10.99.0.0 255.255.255.0
        set two-factor fortitoken-cloud
        set email-to "noc@uni.example"
        set password ENC SH2demoNOTAREALHASHyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy
    next
end
config system ntp
    set ntpsync enable
    set type fortiguard
end
config system snmp community
    edit 1
        set name "public"
        config hosts
            edit 1
                set ip 10.99.0.20 255.255.255.255
            next
        end
    next
end
config log syslogd setting
    set status disable
end
config log fortianalyzer setting
    set status disable
end
config firewall address
    edit "all"
    next
    edit "Student-Net"
        set subnet 10.10.0.0 255.255.0.0
    next
    edit "Lab-Net"
        set comment "Computer lab, Building E"
        set subnet 10.10.80.0 255.255.255.0
    next
    edit "Staff-Net"
        set subnet 10.20.0.0 255.255.0.0
    next
    edit "DC-Net"
        set subnet 10.50.0.0 255.255.255.0
    next
    edit "Web-Portal"
        set subnet 10.50.0.10 255.255.255.255
    next
    edit "Mgmt-Net"
        set subnet 10.99.0.0 255.255.255.0
    next
    edit "Vendor-Partner"
        set subnet 192.0.2.0 255.255.255.0
    next
end
config firewall service custom
    edit "ALL"
        set protocol IP
    next
    edit "HTTP"
        set tcp-portrange 80
    next
    edit "HTTPS"
        set tcp-portrange 443
    next
    edit "SSH"
        set tcp-portrange 22
    next
    edit "TELNET"
        set tcp-portrange 23
    next
    edit "DNS"
        set tcp-portrange 53
        set udp-portrange 53
    next
end
config firewall service group
    edit "Web Access"
        set member "HTTP" "HTTPS"
    next
end
config firewall schedule onetime
    edit "Exam-Week-2025"
        set start "00:00 2025/03/10"
        set end "23:59 2025/03/14"
    next
end
config vpn ipsec phase1-interface
    edit "to-Partner"
        set interface "wan1"
        set ike-version 1
        set proposal aes128-sha1 3des-sha1
        set dhgrp 5 2
        set remote-gw 198.51.100.20
        set psksecret ENC demoNOTAREALSECRETzzzzzzzzzzzzzzzz
    next
end
config vpn ssl settings
    set servercert "Fortinet_Factory"
    set tunnel-ip-pools "SSLVPN_TUNNEL_ADDR1"
    set source-interface "wan1"
    set source-address "all"
    set default-portal "full-access"
end
config firewall policy
