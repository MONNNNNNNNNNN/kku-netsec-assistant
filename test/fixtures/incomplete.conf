#config-version=FGT60F-7.2.8-FW-build1639-240313:opmode=0:vdom=0:user=admin
config firewall address
    edit "Staff-Net"
        set subnet 10.20.0.0 255.255.0.0
    next
end
config firewall policy
    edit 1
        set name "Staff-VPN-Users"
        set srcintf "port1"
        set dstintf "wan1"
        set action accept
        set srcaddr "Staff-Net"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set groups "Staff-Group"
        set logtraffic all
    next
    edit 2
        set name "To-Undefined"
        set srcintf "port1"
        set dstintf "wan1"
        set action accept
        set srcaddr "Lab-Net-Missing"
        set dstaddr "all"
        set schedule "always"
        set service "HTTPS"
        set logtraffic all
    next
end
config firewall policy6
    edit 1
        set srcintf "port1"
        set dstintf "wan1"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
    next
end
frobnicate everything
